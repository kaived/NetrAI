services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "8080:8080"
    volumes:
      - ./backend/runtime_storage:/app/runtime_storage

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:8080"
    depends_on:
      - backend
