[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retinascan-ai-prototype"
version = "0.1.0"
description = "Python prototype lane for RetinaScan AI."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = [
  "numpy",
  "opencv-python",
  "pillow",
  "scikit-image"
]
training = [
  "torch",
  "torchvision",
  "scikit-learn",
  "matplotlib"
]
dev = [
  "pytest",
  "ruff",
  "mypy"
]

[project.scripts]
retinascan-prototype = "retinascan_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
